# Конфигурация CodeRabbit для репозитория: схема V3 (GitHub Cloud).
# Справочник: https://docs.coderabbit.ai/reference/configuration-v3
# Схема: https://www.coderabbit.ai/integrations/schema.v3.json
#
# Здесь только то, что отличается от значений по умолчанию или что легко
# потерять при чтении. Неизвестные поля и опечатки в V3 — ошибка, включая
# вложенные объекты, поэтому лишнего в файле нет.
#
# Уже покрыто значениями по умолчанию, дублировать не нужно:
#   - `reviews.behavior.code_guidelines.enabled: true`, а в его шаблонах по умолчанию
#     есть `**/AGENTS.md`: постоянные правила репозитория уже служат критерием
#     ревью без явного перечисления;
#   - все `reviews.tools.*` включены по умолчанию, включая применимые здесь
#     `markdownlint` (скиллы и документация), `actionlint` и `zizmor` (workflow)
#     и `yamllint` с `gitleaks`.
version: 3

# Язык отзывов ревью. Постоянные правила репозитория требуют русского в текстах
# для человека (AGENTS.md, раздел «Язык»); идентификаторы и пути не переводятся.
language: ru

reviews:
  auto_review:
    # Draft — состояние PR по умолчанию в этом репозитории (git-workflow).
    # Без этого CodeRabbit не ревьюит черновики, то есть большую часть времени
    # жизни PR, пока он не переведён в Ready.
    drafts: true

  output:
    summary:
      # Итог ревью идёт в комментарий-обзор, а не в описание PR: у описания
      # жёсткий контракт — пять разделов и предел 10 000 кодовых точек, который
      # проверяет `pr-body-lint`. Автодополнение описания ломало бы эту структуру.
      placement: walkthrough
